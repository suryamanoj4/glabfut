[project]
name = "glabfut"
version = "0.1.0"
description = "Your GitLab profile, rated out of 99 — FUT-style player card generator"
authors = []
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "glabflow>=0.1.0a10",
    "python-multipart>=0.0.9",
    "aiohttp>=3.14",
]

[tool.uv]
dev-dependencies = []

[project.scripts]
glabfut = "glabfut.main:main"
